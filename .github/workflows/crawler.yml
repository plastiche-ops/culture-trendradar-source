name: Get Hot News

on:
  push:
    branches: [master]
    paths:
      - "config/**"
      - "scripts/export_culture_feed.py"
      - ".github/workflows/crawler.yml"
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ⚠️ 试用版说明 / Trial Mode
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 🔄 运行机制 / How it works:
    #    - 每个周期为 7 天，届时自动停止
    #    - 运行 "Check In" 会重置周期（重新开始 7 天倒计时，而非累加）
    #    - Each cycle is 7 days, then auto-stops
    #    - "Check In" resets the cycle (restarts 7-day countdown, not cumulative)
    #
    # 💡 设计初衷 / Why this design:
    #    如果 7 天都忘了签到，或许这些资讯对你来说并非刚需
    #    适时的暂停，能帮你从信息流中抽离，给大脑留出喘息的空间
    #    If you forget for 7 days, maybe you don't really need it
    #    A timely pause helps you detach from the stream and gives your mind space
    #
    # 🙏 珍惜资源 / Respect shared resources:
    #    GitHub Actions 是平台提供的公共资源，每次运行都会消耗算力
    #    签到机制确保资源分配给真正需要的用户，感谢你的理解与配合
    #    GitHub Actions is a shared public resource provided by the platform
    #    Check-in ensures resources go to those who truly need it — thank you
    #
    # 🚀 长期使用请部署 Docker 版本 / For long-term use, deploy Docker version
    #
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 📝 修改运行时间：只改第一个数字（0-59），表示每小时第几分钟运行
    # 📝 Change time: Only modify the first number (0-59) = minute of each hour
    #
    # 示例 / Examples:
    #   "15 * * * *"     → 每小时第15分钟 / minute 15 every hour
    #   "30 0-14 * * *"  → 北京时间 8:00-22:00 每小时第30分钟 / Beijing 8am-10pm
    #
    - cron: "33 * * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: true

      - name: Load previous public feed
        continue-on-error: true
        run: |
          git fetch origin radar-data:refs/remotes/origin/radar-data || true
          mkdir -p output
          git show origin/radar-data:culture-feed.json > output/previous-culture-feed.json || true

      # Permanent hourly collection: no seven-day trial expiry.

      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success()
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Export culture feed
        if: success()
        run: |
          uv run python scripts/export_culture_feed.py \
            --previous output/previous-culture-feed.json \
            --out /tmp/culture-feed.json

      - name: Publish culture feed
        if: success()
        run: |
          git config user.name "culture-radar-bot"
          git config user.email "culture-radar-bot@users.noreply.github.com"
          if git show-ref --verify --quiet refs/remotes/origin/radar-data; then
            git switch --detach origin/radar-data
          else
            git switch --orphan radar-data
            git rm -rf .
          fi
          cp /tmp/culture-feed.json culture-feed.json
          git add culture-feed.json
          git commit -m "Update culture radar feed" || exit 0
          git push origin HEAD:radar-data

      - name: Push curated culture radar digest to WeCom
        if: success()
        env:
          CULTURE_WECOM_WEBHOOK: ${{ secrets.CULTURE_WECOM_WEBHOOK }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          webhook = os.environ.get("CULTURE_WECOM_WEBHOOK", "").strip()
          if not webhook:
              print("CULTURE_WECOM_WEBHOOK is not configured; skipping WeCom push.")
              sys.exit(0)

          now_cn = datetime.now(ZoneInfo("Asia/Shanghai"))
          if os.environ.get("EVENT_NAME") != "workflow_dispatch" and now_cn.hour != 10:
              print(f"Not the daily 10:00 China-time window ({now_cn:%H:%M}); skipping WeCom push.")
              sys.exit(0)

          candidates = [Path("/tmp/culture-feed.json"), Path("culture-feed.json")]
          feed_path = next((path for path in candidates if path.exists()), None)
          if feed_path is None:
              raise SystemExit("culture-feed.json was not found")

          feed = json.loads(feed_path.read_text(encoding="utf-8"))
          items = feed.get("items") or []
          cutoff = datetime.now(timezone.utc) - timedelta(hours=36)

          def parsed(value):
              if not value:
                  return datetime.min.replace(tzinfo=timezone.utc)
              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=ZoneInfo("Asia/Shanghai"))
                  return dt.astimezone(timezone.utc)
              except ValueError:
                  return datetime.min.replace(tzinfo=timezone.utc)

          items.sort(
              key=lambda item: parsed(item.get("publishedAt") or item.get("firstSeen")),
              reverse=True,
          )
          fresh = [
              item for item in items
              if parsed(item.get("firstSeen") or item.get("publishedAt")) >= cutoff
          ]
          selected = (fresh or items)[:10]

          lines = [
              "# 文化热点雷达日报",
              f">更新时间：{now_cn:%Y-%m-%d %H:%M}｜新增候选：{len(fresh)}条",
              "",
          ]
          for index, item in enumerate(selected, 1):
              title = str(item.get("title") or "未命名线索").replace("\n", " ").strip()
              url = str(item.get("url") or "https://culture-radar.plastiche0225.chatgpt.site")
              kind = str(item.get("type") or "文化热点")
              lines.append(f"{index}. [{title}]({url})")
              lines.append(f"> {kind}｜{item.get('source') or '公开出处'}")
          lines.extend([
              "",
              "[查看全部文化线索](https://culture-radar.plastiche0225.chatgpt.site)",
              "> 互动数据未接入时不推测、不补数。",
          ])

          content = "\n".join(lines)
          while len(content.encode("utf-8")) > 3900 and len(selected) > 1:
              selected.pop()
              lines = lines[:3]
              for index, item in enumerate(selected, 1):
                  title = str(item.get("title") or "未命名线索").replace("\n", " ").strip()
                  url = str(item.get("url") or "https://culture-radar.plastiche0225.chatgpt.site")
                  kind = str(item.get("type") or "文化热点")
                  lines.append(f"{index}. [{title}]({url})")
                  lines.append(f"> {kind}｜{item.get('source') or '公开出处'}")
              lines.extend([
                  "",
                  "[查看全部文化线索](https://culture-radar.plastiche0225.chatgpt.site)",
                  "> 互动数据未接入时不推测、不补数。",
              ])
              content = "\n".join(lines)

          payload = json.dumps(
              {"msgtype": "markdown", "markdown": {"content": content}},
              ensure_ascii=False,
          ).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              result = json.loads(response.read().decode("utf-8"))
          if result.get("errcode") != 0:
              raise SystemExit(f"WeCom push failed: {result}")
          print(f"WeCom push succeeded with {len(selected)} items.")
          PY

      # --------------------------------------------------------------------------------
      # ☁️ CLOUDFLARE PAGES DEPLOY / 部署到 Cloudflare Pages（可选）
      # --------------------------------------------------------------------------------
      # 将爬虫生成的 index.html 自动部署到 Cloudflare Pages，国内访问比 GitHub Pages 更快。
      # 仅当下面三个 Secrets 均已配置时才会执行，缺任意一个则自动跳过，不影响其它流程：
      #   - CLOUDFLARE_API_TOKEN     权限：Account → Cloudflare Pages → Edit
      #   - CLOUDFLARE_ACCOUNT_ID    Cloudflare 账户 ID
      #   - CLOUDFLARE_PROJECT_NAME  Cloudflare Pages 项目名（需提前在 Dashboard 创建）
      # 配置教程详见 README「自动部署到 Cloudflare Pages」章节。
      # --------------------------------------------------------------------------------
      - name: Check Cloudflare config
        if: success()
        id: cf_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 Cloudflare 配置，准备部署到 Cloudflare Pages"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 未配置 Cloudflare Secrets，跳过 Cloudflare Pages 部署"
          fi

      - name: Prepare Cloudflare Pages assets
        if: success() && steps.cf_check.outputs.enabled == 'true'
        run: |
          if [ ! -f index.html ]; then
            echo "❌ 未找到 index.html，请确认爬虫已生成网页报告"
            exit 1
          fi
          rm -rf cloudflare_dist
          mkdir -p cloudflare_dist
          cp index.html cloudflare_dist/index.html

      - name: Deploy to Cloudflare Pages
        if: success() && steps.cf_check.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare_dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
